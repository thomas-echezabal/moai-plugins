name: Marketplace validation

on:
  pull_request:
  push:
    branches:
      - main
      - preview
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketplace:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Install Codex validator
        run: npm install --global @openai/codex@0.145.0

      - name: Validate release policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            fi
          fi

          if [ -n "$base" ]; then
            node scripts/validate-marketplace.mjs --base "$base"
          else
            node scripts/validate-marketplace.mjs
          fi

      - name: Validate Inbox Assistant content
        run: node scripts/validate-inbox-assistant.mjs

      - name: Test Inbox Assistant hook policy
        run: node scripts/test-inbox-assistant-hook.mjs

      - name: Validate Anthropic plugin schemas
        run: claude plugin validate . --strict

      - name: Install every plugin through Codex
        shell: bash
        run: |
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          while IFS= read -r plugin; do
            codex plugin add "$plugin@moai-plugins"
          done < <(node -e 'for (const plugin of require("./.agents/plugins/marketplace.json").plugins) console.log(plugin.name)')
          codex plugin list
